{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card p-4">
      <h4 class="mb-3">Вход в дэшборд</h4>
      {% if error %}
        <div class="alert alert-danger py-2">Неверный пароль</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label">Пароль (ADMIN_PASSWORD)</label>
          <input type="password" class="form-control" name="password" autofocus required>
        </div>
        <button class="btn btn-primary w-100">Войти</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
